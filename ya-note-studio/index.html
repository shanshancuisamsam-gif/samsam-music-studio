</style><main><header><div><small>SAMSAM MUSIC STUDIO</small><h1>YA 音符编辑室</h1></div><button onclick="window.print()">打印 A4</button></header><section><svg id="score" viewBox="0 0 1491 1055" aria-label="可编辑的高音谱号五线谱"><rect width="1491" height="1055" fill="#fffdf7"/><g font-family="system-ui" fill="#265e56"><text x="745" y="155" text-anchor="middle" font-size="74">“YA” 音练习曲</text><text x="745" y="225" text-anchor="middle" font-size="36">YA Vocal Exercise</text><text x="197" y="835" font-size="110">YA</text><text x="500" y="790" font-size="28">轻轻微笑，自然张口。</text><text x="500" y="839" font-size="28">Smile gently and open your mouth.</text><text x="745" y="1010" text-anchor="middle" font-size="22">samsam music studio</text></g><path d="M197 464H1294 M197 491H1294 M197 518H1294 M197 545H1294 M197 572H1294" stroke="#242424" stroke-width="2"/><g transform="translate(252 545) scale(1.35)" fill="none" stroke="#202020" stroke-width="3.8" stroke-linecap="round"><path d="M-2 10C-19 5 -12 -12 0 -12C21 -12 24 13 8 19C-10 27 -27 12 -21 -5C-17 -17 0 -30 5 -42C11 -55 10 -68 6 -72C-2 -69 -5 -54 -3 -39L8 38Q10 54 -5 52Q-14 51 -12 43"/><circle cx="-10" cy="43" r="3.6" fill="#202020"/></g><g id="notes"></g></svg><aside><h2>编辑音符</h2><p>点选谱上的音符，再选择音高。也可以用左右键选音符，上下键调音高。</p><label for="pitch" id="caption"></label><select id="pitch"></select><button id="play">▶ 试听旋律</button><button id="reset">恢复 C D E D C</button><p id="message" aria-live="polite">每个音唱一拍 · 每分钟 90 拍</p></aside></section></main><script>
const pitches=['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5'],midi=[60,62,64,65,67,69,71,72,74,76,77],initial=[0,1,2,1,0],key='samsam-ya-notes.v1';
let values=initial.slice(),active=0,audio,timer,voices=[];
try{let v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v)&&v.length===5&&v.every(i=>Number.isInteger(i)&&i>=0&&i<pitches.length))values=v}catch{}
const el=id=>document.getElementById(id),select=el('pitch'),group=el('notes');
pitches.forEach(p=>select.add(new Option(p+(p==='C4'?' · 中央 C':''),select.length)));
function draw(focus=false){group.innerHTML=values.map((p,i)=>{let x=385+180*i,y=599-13.5*p,up=p<6,stem=x+(up?14:-14);return '<g role="button" tabindex="0" data-i="'+i+'" aria-label="第 '+(i+1)+' 个音 '+pitches[p]+'" aria-pressed="'+(active===i)+'" class="'+(active===i?'selected':'')+'"><rect x="'+(x-48)+'" y="345" width="96" height="308" fill="transparent"/>'+(active===i?'<ellipse class="halo" cx="'+x+'" cy="'+y+'" rx="30" ry="23"/>':'')+(p===0?'<path d="M'+(x-25)+' 599h50" stroke="#202426" stroke-width="3"/>':'')+'<rect x="'+(stem-1.6)+'" y="'+(up?y-92:y)+'" width="3.2" height="92"/><ellipse cx="'+x+'" cy="'+y+'" rx="17" ry="11" transform="rotate(-18 '+x+' '+y+')"/><text x="'+x+'" y="642" text-anchor="middle" font-size="22" font-family="system-ui">'+pitches[p]+'</text></g>'}).join('');select.value=values[active];el('caption').textContent='第 '+(active+1)+' 个音 / Note '+(active+1);if(focus)group.children[active].focus()}
function save(){try{localStorage.setItem(key,JSON.stringify(values))}catch{}}
function stop(){clearTimeout(timer);voices.forEach(o=>{try{o.stop()}catch{}});voices=[];el('play').textContent='▶ 试听旋律'}
function change(v){stop();values[active]=v;save();draw()}
group.onclick=e=>{let g=e.target.closest('[data-i]');if(g){active=+g.dataset.i;draw(true)}};
group.onkeydown=e=>{let g=e.target.closest('[data-i]');if(!g)return;active=+g.dataset.i;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft'||e.key==='ArrowRight')active=Math.max(0,Math.min(4,active+(e.key==='ArrowRight'?1:-1)));if(e.key==='ArrowUp'||e.key==='ArrowDown')change(Math.max(0,Math.min(10,values[active]+(e.key==='ArrowUp'?1:-1))));draw(true)};
select.onchange=()=>change(+select.value);el('reset').onclick=()=>{stop();values=initial.slice();active=0;save();draw()};
el('play').onclick=async()=>{if(voices.length){stop();return}try{audio??=new AudioContext();await audio.resume();let start=audio.currentTime+.04,beat=60/90;values.forEach((p,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=start+i*beat;o.frequency.value=440*2**((midi[p]-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+beat-.03);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+beat);voices.push(o)});el('play').textContent='■ 停止试听';timer=setTimeout(stop,3500)}catch{el('message').textContent='当前浏览器无法播放，请检查声音设置。'}};draw()
</script></html>
